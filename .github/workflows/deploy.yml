name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # раз в сутки: свежие размеры и список изменений, даже если пуша не было
  workflow_dispatch:      # из процесса релиза: gh workflow run deploy.yml -R ruvoice-tts/ruvoice-tts.github.io

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test
      - run: npm run e2e --if-present
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
